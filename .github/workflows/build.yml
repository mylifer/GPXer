name: Derleme

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Yarıda kesilen bir sürüm eksik dosyalarla kalmasın diye iptal edilmez.
  cancel-in-progress: false

jobs:
  version:
    name: Sürüm
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # Sürüm yayımlanacaksa etiketi belirler: v* etiketi push'landıysa o
      # etiket; bir dala push'ta tauri.conf.json'daki sürümün etiketi henüz
      # yoksa v<sürüm>. Aksi halde boş kalır ve yalnızca derleme yapılır.
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* ]] &&
             ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Yeni sürüm: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux derleme bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      # Uygulama crate'i derlenirken arayüz paketinin (dist) var olması gerekir.
      - run: npm run build
      - run: cargo test -p gpx-core -p gpxer

  # Sürüm yayımlanacaksa önce tek bir TASLAK sürüm oluşturulur; iki platformun
  # derlemesi dosyalarını buna yükler. Taslak, her iki derleme de bitince
  # "publish" işinde yayımlanır; böylece güncelleme denetimi
  # (releases/latest/download/latest.json) hiçbir zaman eksik platformlu bir
  # sürüm görmez.
  release:
    name: Taslak sürüm
    needs: [test, version]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Yarıda kalmış bir çalıştırmanın taslağı varsa o kullanılır.
          ID=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq "[.[] | select(.draft and .tag_name == \"$TAG\")][0].id // empty")
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/$GH_REPO/releases" -X POST \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="GPXer $TAG" \
              -f body="Kurulu GPXer bu sürümü bulup güncellemeyi önerir." \
              -F draft=true --jq .id)
          fi
          echo "Taslak sürüm: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  bundle:
    name: Kurulum (${{ matrix.name }})
    needs: [test, version, release]
    # Sürüm yayımlanmayacaksa "release" atlanır; derleme yine yapılır.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.version.result == 'success' && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            bundle: target/release/bundle
          - name: macOS
            # Yalnızca Apple Silicon: macos-latest ARM olduğundan doğrudan
            # derlenir, Intel için ikinci bir derleme yapılmaz.
            os: macos-latest
            args: ""
            bundle: target/release/bundle
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # İmza anahtarı tanımlı değilse güncelleme paketleri üretilmez;
      # kurulum dosyaları yine derlenir.
      - name: Güncelleme imzasını kapat (anahtar yok)
        if: env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          '
      # Kod imzalama: ilgili gizli değerler repo ayarlarında tanımlıysa
      # etkinleşir; yoksa paketler imzasız (macOS'ta ad-hoc imzalı) derlenir.
      # Boş değişkenler Tauri'yi yanıltmasın diye yalnızca doluysa aktarılır.
      - name: macOS imzası ve noter onayı
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              {
                echo "$v<<__EOF__"
                echo "${!v}"
                echo "__EOF__"
              } >> "$GITHUB_ENV"
            fi
          done
      - name: Windows imzası
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $f = "src-tauri/tauri.conf.json"
          $c = Get-Content $f -Raw | ConvertFrom-Json
          $c.bundle.windows | Add-Member -Force certificateThumbprint $cert.Thumbprint
          $c.bundle.windows | Add-Member -Force digestAlgorithm "sha256"
          $c.bundle.windows | Add-Member -Force timestampUrl "http://timestamp.digicert.com"
          $c | ConvertTo-Json -Depth 20 | Set-Content $f -Encoding utf8
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          # Sürüm etiketi varsa dosyalar "release" işinin oluşturduğu taslak
          # sürüme yüklenir; yayımlama "publish" işinde yapılır.
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: GPXer ${{ needs.version.outputs.tag }}
          releaseBody: Kurulu GPXer bu sürümü bulup güncellemeyi önerir.
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - uses: actions/upload-artifact@v4
        with:
          name: GPXer-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error

  # Her iki derleme de başarılıysa taslak sürüm yayımlanır. İki derleme
  # latest.json'u aynı anda güncelleyebildiğinden önce eksik platform
  # imzalı dosyalardan tamamlanır; taslakta "untagged-…" olan indirme
  # adresleri etiket adresine çevrilir.
  publish:
    name: Sürümü yayımla
    needs: [version, release, bundle]
    if: needs.version.outputs.tag != '' && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_ID: ${{ needs.release.outputs.id }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: latest.json'u tamamla
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/$GH_REPO/releases/download/$TAG"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" > assets.json
          asset() { jq -r --arg re "$1" '[.[] | select(.name | test($re)) | .name][0] // empty' assets.json; }
          sig() {
            local id
            id=$(jq -r --arg n "$1.sig" '.[] | select(.name == $n) | .id' assets.json)
            [ -n "$id" ] && gh api "repos/$GH_REPO/releases/assets/$id" -H "Accept: application/octet-stream"
          }
          LATEST_ID=$(jq -r '.[] | select(.name == "latest.json") | .id' assets.json)
          if [ -n "$LATEST_ID" ]; then
            gh api "repos/$GH_REPO/releases/assets/$LATEST_ID" -H "Accept: application/octet-stream" > latest.json
          else
            jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $v, notes: "Kurulu GPXer bu sürümü bulup güncellemeyi önerir.", pub_date: $d, platforms: {}}' > latest.json
          fi
          add() {
            local key="$1" re="$2" name s
            name=$(asset "$re")
            [ -z "$name" ] && { echo "::warning::$key için dosya yok"; return; }
            s=$(sig "$name") || { echo "::warning::$name.sig yok"; return; }
            jq --arg k "$key" --arg u "$BASE/$name" --arg s "$s" \
              '.platforms[$k] //= {signature: $s, url: $u}' latest.json > tmp.json && mv tmp.json latest.json
          }
          add windows-x86_64 '-setup\.exe$'
          add windows-x86_64-nsis '-setup\.exe$'
          add darwin-aarch64 '\.app\.tar\.gz$'
          add darwin-aarch64-app '\.app\.tar\.gz$'
          # Taslak adresleri ("untagged-…") yayımlanınca geçersizleşir.
          jq --arg b "$BASE/" '.platforms |= map_values(.url |= sub("^https://github.com/[^/]+/[^/]+/releases/download/[^/]+/"; $b))' \
            latest.json > tmp.json && mv tmp.json latest.json
          cat latest.json
          for k in windows-x86_64 darwin-aarch64; do
            jq -e --arg k "$k" '.platforms[$k].url' latest.json > /dev/null || { echo "::error::latest.json'da $k yok"; exit 1; }
          done
          if [ -n "$LATEST_ID" ]; then
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$LATEST_ID"
          fi
          UPLOAD="https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=latest.json"
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @latest.json "$UPLOAD" > /dev/null
      - name: Yayımla
        shell: bash
        run: |
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq .html_url
