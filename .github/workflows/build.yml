name: Derleme

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Yarıda kesilen bir sürüm eksik dosyalarla kalmasın diye iptal edilmez.
  cancel-in-progress: false

jobs:
  version:
    name: Sürüm
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # Sürüm yayımlanacaksa etiketi belirler: v* etiketi push'landıysa o
      # etiket; bir dala push'ta tauri.conf.json'daki sürümün etiketi henüz
      # yoksa v<sürüm>. Aksi halde boş kalır ve yalnızca derleme yapılır.
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* ]] &&
             ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Yeni sürüm: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo test -p gpx-core
      - run: npm ci
      - run: npm run build

  bundle:
    name: Kurulum (${{ matrix.name }})
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            bundle: target/release/bundle
          - name: macOS
            # Yalnızca Apple Silicon: macos-latest ARM olduğundan doğrudan
            # derlenir, Intel için ikinci bir derleme yapılmaz.
            os: macos-latest
            args: ""
            bundle: target/release/bundle
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # İmza anahtarı tanımlı değilse güncelleme paketleri üretilmez;
      # kurulum dosyaları yine derlenir.
      - name: Güncelleme imzasını kapat (anahtar yok)
        if: env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          '
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          # Sürüm etiketi varsa GitHub sürümü (etiketiyle birlikte) yayımlanır.
          # Uygulama güncellemeleri son yayımlanan sürümün latest.json
          # dosyasından denetler, bu yüzden sürüm taslak bırakılmaz.
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: GPXer ${{ needs.version.outputs.tag }}
          releaseBody: Kurulu GPXer bu sürümü bulup güncellemeyi önerir.
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - uses: actions/upload-artifact@v4
        with:
          name: GPXer-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error
